[project]
name = "omnexa_theme_manager"
authors = [{ name = "ErpGenEx", email = "dev@erpgenex.com"}]
description = "Free desk hub to manage ERPGenEx / tenant themes (depends on omnexa_experience)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"
